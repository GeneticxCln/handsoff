# Release gate (audit phase 4): a worker thread that raises while the suite
# runs must fail CI and local runs instead of surfacing as a warning. This is
# what caught the "Signal source has been deleted" crash after the Qt teardown
# guard was relaxed.
[pytest]
testpaths = tests
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning

# Coverage floor: TOTAL >= 70% (suite measures ~71%, with subprocess coverage
# engaged for the offscreen-GUI scenarios). Enforced by the `coverage` job in
# .github/workflows/ci.yml via --cov-fail-under (local `pytest` stays
# plugin-free; coverage.py does not read pytest.ini, so the floor lives in
# .coveragerc).