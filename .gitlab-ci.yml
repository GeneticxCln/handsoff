# GitLab CI — mirrors .github/workflows/ci.yml gate-for-gate for this repo's
# GitLab remote (origin: gitlab.com/GeneticxClm/handsoff). The GitHub
# workflow stays the authoritative definition: when a gate changes there,
# change it here too.
#
# It no longer mirrors the IMAGES, and that is the one deliberate difference.
# GitLab-hosted (instance) runners are billed to the namespace's 400 free compute
# minutes a month, all three projects under this account draw on that one pool,
# and this repo's five suite jobs spent it by 13 September — after which every job
# on an instance runner died with `ci_quota_exceeded` before running a single
# test (364 of them), and a merge request's pipeline said nothing at all about the
# merge request. The gates now run on the desk runner: a project runner on the
# developer's machine, tagged `desk`, where a job is not billed.
#
# What is mirrored is what the gates CHECK — same suites, same python versions,
# same order seed, same coverage floor, same junit report and same failure digest
# — while the runner underneath is the desk's instead of a frozen Debian image.
# Local-only BY DESIGN, absent here and in GH: `clean-checkout` (it lays HEAD
# down in a scratch tree to test the committed tree — on a CI checkout that is
# the tree already, so it would test nothing) and `two-writer` (it needs the
# developer's real desktop to race two processes against). The suite itself
# still runs both gate's test files as part of `tests/`.
# `suite:hosted` is the frozen-image reference for when the question is whether
# the desk and the image agree: manual, because it spends minutes; allowed to
# fail, because it never gates a merge; and defined ONLY for pipelines started
# from the web UI or the API, because GitLab refuses every job of a pipeline at
# creation once the namespace's minutes are spent — manual jobs included, which
# is measured, not assumed (see the job's own comment). Supply-chain parity is unchanged where
# images are used: every one is pinned by *digest* (tag in a trailing comment),
# and the `shell` job fails CI if a mutable tag-only image ref sneaks back in —
# same policy as the SHA-pinned GH actions.
#
# Two things the desk needs that an image would have provided, both checked
# rather than assumed: the CPython each job asked for (ci/desk_python.sh, via uv)
# and the runtime libraries (ci/apt_deps.sh, which installs on Debian and
# verifies elsewhere). A desk node/python that does not match fails the job
# rather than quietly standing in for the image it replaces.
#
# The suite jobs hold a resource_group (`handsoff-suite`), so the desk runs one
# suite at a time: on a hosted runner each job owns a fresh container, and on a
# desk they would own the same GPU, audio server and /tmp — measured, twice, in
# one pipeline (see .tests_base). Serialising costs wall time (about 23 minutes
# of machine time per push instead of 10) and buys a signal that is about the
# commit rather than about its neighbours.
#
# PySide6 + sounddevice: the wheels bundle Qt but offscreen rendering still needs
# runtime libraries (glib/GL/EGL/xkbcommon/dbus/fontconfig), and sounddevice
# needs the PortAudio library itself (libportaudio2) plus the ALSA runtime that
# PortAudio links against (libasound2t64) — see the `.qt_deps` note below, where
# getting that pair wrong is what failed the tests jobs.
#
# When a suite job fails, read the summary before the log: the junit report
# gives GitLab's Test-summary tab, and `after_script` prints a short digest of
# failing tests plus the known env-fix hints (see ci/pytest_summary.py).

stages: [test, static, smoke]

default:
  interruptible: true

# One pipeline per ref: a superseded push cancels the older one rather than
# racing it for a desk that runs two jobs at a time, and a branch carrying an
# open merge request is judged by that MR's pipeline instead of by it AND a
# second branch pipeline saying the same thing — which is how a quota gets spent
# twice on one commit.
#
# TRUST (2026-09-27, audit finding P1): `merge_request_event` is GONE from these
# rules, and that is the load-bearing half of the fix. Every job below is tagged
# `desk` — a self-hosted runner on the developer's OWN machine (see the header
# above), not an ephemeral container. Admitting MR pipelines therefore executed
# the MR author's own `tests/`, `ci/` and `install.sh` with the runner account's
# home directory, SSH agent, GPU and audio devices. The first rule below is
# therefore a REFUSAL: an MR pipeline is not created at all, so there is no
# window in which untrusted code is on the desk. The remaining rules are the
# ones whose code comes from this repository's own protected branches and tags.
#
# If a fork's MR must be gated, run it on an ISOLATED ephemeral runner (a
# container with no host socket, no volume mounts, no runner credentials) under
# a different tag — do NOT re-admit `merge_request_event` onto `desk`.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Untrusted contributor code: refused. This is the rule that keeps a fork's
    # tests/*.py and ci/*.sh off the developer's workstation.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Per-job plumbing shared by every job that runs the suite: the pip download
# cache (keyed on the constraints file), the junit report that feeds GitLab's
# native Test-summary tab and MR test widget, and the log digest that turns a
# failure into a short list of names + messages + the env fix.
#
# `when: always` + `after_script` are what make failures self-explanatory: the
# report uploads and the digest prints even when the job dies, and both follow
# the report even when it was never written (the digest says so explicitly).
.shared: &shared
  cache:
    key:
      files:
        - requirements-lock.txt
    paths:
      - .pip-cache
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: tests/report.xml
  # A fresh shell with a reset cwd, so both paths are absolute.
  #
  # TRUST (2026-09-27, audit finding P1): this runs the CHECKED-OUT tree's own
  # ci/pytest_summary.py, and that script reads GITLAB_SUMMARY_TOKEN (or
  # GITLAB_API_TOKEN) straight from the environment — a real personal access
  # token, because a CI job token cannot create notes (GitLab issue #464591;
  # ci/pytest_summary.py:26-29). So a pipeline whose source tree is not a
  # protected ref would be handing that token to whatever the tree contains.
  #
  # The rule above already refuses merge-request pipelines, so every pipeline
  # reaching here is a push or a tag from this repository. This second guard is
  # the defence in depth that does not depend on remembering that: it refuses
  # to run the tree's script at all unless the ref is protected, and it drops
  # the token from the environment either way, so the script's own
  # "token not set — skipping" path runs rather than a posting path.
  #
  # GITLAB_SUMMARY_TOKEN must ALSO be configured as Protected in the project's
  # CI/CD variables. Masked alone only hides the value in logs; Protected is
  # what stops it being injected into a pipeline from a non-protected ref. This
  # file cannot enforce that setting — it is a project configuration, and the
  # `shell` job below fails CI if this guard is ever removed.
  after_script:
    - |
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        python "$CI_PROJECT_DIR/ci/pytest_summary.py" \
          "$CI_PROJECT_DIR/tests/report.xml" --post
      else
        echo "summary: ref '$CI_COMMIT_REF_NAME' is NOT protected — the"
        echo "  merge-request note is skipped and GITLAB_SUMMARY_TOKEN is not"
        echo "  exposed to this pipeline. See .gitlab-ci.yml (.shared)."
        unset GITLAB_SUMMARY_TOKEN GITLAB_API_TOKEN
      fi

# The runtime layer every suite job inherits. It is a SCRIPT, not a one-liner:
# a single unknown package name fails the whole `apt-get install`, the `&&`
# chain then installs nothing, and the job runs the entire suite against a
# container with no audio or Qt runtime — hundreds of `import handsoff` errors
# whose cause is one line at the top of the log. That is not hypothetical:
# `libdbus-1-3t64` does not exist in this image, so nothing was ever installed,
# no matter what the list said. ci/apt_deps.sh installs each package on its
# own, tries the t64 and plain names, verifies the SONAMEs by file — including
# the `ctypes.util.find_library('portaudio')` lookup sounddevice performs at
# import — so a gap fails there, by name. On the desk (no apt) the same script
# verifies instead of installing, by the same two tests.
.qt_deps: &qt_deps
  "bash ci/apt_deps.sh"

# The CPython a desk job runs: the version its image would have given it, from
# ci/desk_python.sh (a uv-managed venv per version, reused warm). It exports
# PATH so the lines below are the same lines the hosted job runs, and points
# bytecode at /tmp because the desk interpreter lives under $HOME while the
# suite's own write guard refuses any test write into the developer's real user
# dirs — a rule with no artifact exemption, deliberately. Measured: without the
# redirect that guard refuses the run at the first stdlib import.
.desk_python: &desk_python
  |
  export PATH="$(bash ci/desk_python.sh):$PATH"
  export PYTHONPYCACHEPREFIX="${TMPDIR:-/tmp}/handsoff-ci-pycache/py$PY_VERSION"
  python -V

# --- The full test suite (GH: `tests` matrix job) ---------------------------
# Single source of truth: requirements.txt (pinned floors) installed with the
# checked-in constraints file for reproducibility — same as GH, same command.
.tests_base:
  stage: test
  tags:
    - desk
  # ONE suite at a time on this machine, and that is measured rather than
  # cautious. With two full suites running together the first desk pipeline that
  # carried a change collided twice: `test_precommit_staged`'s scratch-tree
  # check reported the OTHER job's in-flight /tmp/handsoff-staged-* tree as its
  # own leak (both legs, same seconds), and the offscreen live-probe scenario's
  # whisper worker was still answering when its wall-clock deadline expired.
  # The suite exercises real devices — GPU speech models, offscreen Qt, the audio
  # server — and owns them for its duration, so a green is a verdict about the
  # commit only when nothing else is running one. Both tests were fixed at the
  # same time (own scratch namespace, joins instead of deadlines); this is the
  # belt, not the only braces.
  resource_group: handsoff-suite
  variables:
    # The offscreen-launch test spawns the real bubble without a display.
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    # Which leg of the GH matrix this job stands in for; ci/desk_python.sh
    # refuses any interpreter that does not answer with it.
    PY_VERSION: "3.12"
  <<: *shared
  script:
    - *desk_python
    - *qt_deps
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    - python -m pytest tests/ -q
      --junitxml="$CI_PROJECT_DIR/tests/report.xml"

tests:3.12:
  extends: .tests_base

tests:3.13:
  extends: .tests_base
  variables:
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PY_VERSION: "3.13"

# The third leg is the one the desk actually runs: install.sh takes whatever
# `python3` is on PATH, which on Arch is 3.14, so a matrix without it graded a
# python nobody ships. Mirrors GH's `python-version` list — change one, change
# both. It costs a third suite run on the desk's wall clock, which is why the
# legs share the `handsoff-suite` resource_group below rather than overlapping.
tests:3.14:
  extends: .tests_base
  variables:
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PY_VERSION: "3.14"

# --- Ordering-dependence probe (GH: `order` job) ---------------------------
# The suite must pass whatever order it runs in; the default collection order
# is what hides a dependence on it. Two full re-runs: tests shuffled, then
# only the FILE order shuffled. The seed is the commit SHA (different every
# commit, printed by the run banner, exactly reproducible). The first run to
# fail leaves its junit report in place for the summary — the pipeline stops
# before the second overwrites it.
order:
  stage: test
  tags:
    - desk
  resource_group: handsoff-suite   # see .tests_base: never beside another suite
  variables:
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    # The shuffle is interpreter-blind, so this leg is 3.12 alone — the same
    # choice the GH job makes with its single setup-python step.
    PY_VERSION: "3.12"
  <<: *shared
  # Restated rather than inherited: a job that declares `artifacts` REPLACES the
  # shared block's, so the `when`/`expire_in` have to be here too or the upload
  # would only happen on success. The junit list is the whole point — both
  # reports reach the Test tab, so neither run's verdict can hide the other's.
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - tests/report.xml
        - tests/report-order-files.xml
  # The shared digest reads the first report and posts the MR note; this adds
  # the second report to the log as a section of its own. Deleting the shared
  # one is not an option (every suite job needs it), so the override is here.
  after_script:
    - python "$CI_PROJECT_DIR/ci/pytest_summary.py"
      "$CI_PROJECT_DIR/tests/report.xml" --post
    - python "$CI_PROJECT_DIR/ci/pytest_summary.py"
      "$CI_PROJECT_DIR/tests/report-order-files.xml"
  script:
    - *desk_python
    - *qt_deps
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    # Two runs, two reports. Both used to write tests/report.xml, so the second
    # overwrote the first: a FILE-order failure replaced the seed-order run's
    # report in GitLab's Test tab, and the report the shared anchor uploads
    # described only whichever run happened to be last. Each run now has its own
    # file, and BOTH are accepted — the artifact below lists both (a junit array
    # is part of the schema: verified against GitLab's own ci.json) and the log
    # digest reads both, the second one WITHOUT --post so the merge-request note
    # stays a single summary rather than two.
    - HANDSOFF_TEST_ORDER_SEED="$CI_COMMIT_SHA" python -m pytest tests/ -q
      --junitxml="$CI_PROJECT_DIR/tests/report.xml"
    - HANDSOFF_TEST_ORDER_FILES="$CI_COMMIT_SHA" python -m pytest tests/ -q
      --junitxml="$CI_PROJECT_DIR/tests/report-order-files.xml"

# --- Coverage floor (GH: `coverage` job) ------------------------------------
coverage:
  stage: test
  tags:
    - desk
  resource_group: handsoff-suite   # see .tests_base: never beside another suite
  variables:
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PY_VERSION: "3.12"
    # Subprocess coverage: the offscreen-GUI drivers engage measurement when
    # COVERAGE_PROCESS_START is set, and the absolute COVERAGE_FILE keeps
    # their parallel data files in the workspace for the combine.
    COVERAGE_PROCESS_START: "$CI_PROJECT_DIR/.coveragerc"
    COVERAGE_FILE: "$CI_PROJECT_DIR/.coverage"
  <<: *shared
  script:
    - *desk_python
    - *qt_deps
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    - pip install pytest-cov
    - python -m pytest tests/ -q --cov=. --cov-config=.coveragerc
      --cov-report=term-missing --cov-fail-under=70
      --junitxml="$CI_PROJECT_DIR/tests/report.xml"

# --- The frozen-image reference (manual) ------------------------------------
# The one job that still runs where this file used to: the digest-pinned Debian
# image, with the apt layer doing what it was written for. It is MANUAL because
# it spends the namespace's compute minutes, and `allow_failure` because a
# reference is not a gate — it never blocks a merge. Ask for it when the question
# is whether the desk runner and the image agree, or when the desk is offline.
suite:hosted:
  stage: test
  image: "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea" # 3.12-slim
  # Absent from a push pipeline, and that is MEASURED rather than cautious: once
  # the namespace's compute minutes are spent, GitLab refuses every job of a
  # pipeline at creation — this one included, `when: manual` or not. Job
  # 16625849832 was created and finished 7 ms apart, never queued, with
  # `failure_reason: ci_quota_exceeded`, so leaving it in put a red mark on every
  # pipeline that said nothing about the commit. It exists in pipelines started
  # from the web UI or the API — which is where a human asking for the
  # frozen-image reference starts one.
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
    - when: never
  allow_failure: true
  variables:
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  <<: *shared
  script:
    - *qt_deps
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    - python -m pytest tests/ -q
      --junitxml="$CI_PROJECT_DIR/tests/report.xml"

# --- Byte-compile every shipped source (GH: `compile` job) ------------------
# py_compile never imports: no Qt libs or dependencies needed at all. It runs on
# the OLDEST version in the matrix, because that is what catches syntax the
# newest interpreter accepts and the shipped floor does not.
# The lint gate, mirroring GH's `lint` job and `ruff.toml` gate-for-gate: the
# rule set is pinned in one file both sides read, and ruff is pinned here to
# the same version so the desk's answer and GitHub's are the same answer. It
# installs ONE thing (ruff) into a throwaway job venv — not the bubble's
# environment — so this costs the desk a few seconds and nothing else.
lint:
  stage: static
  tags:
    - desk
  variables:
    PY_VERSION: "3.12"
  script:
    - *desk_python
    - pip install 'ruff==0.16.4'
    - ruff check --no-cache
      handsoff.py handsoff-settings.py hardware.py settings_schema.py core/ ci/

compile:
  stage: static
  tags:
    - desk
  variables:
    PY_VERSION: "3.12"
  script:
    - *desk_python
    # Discovered, not listed: an enumerated compile set silently skips a newly
    # added module — exactly how core/theme.py escaped the installer. attic/
    # (provenance archive) stays out, matching .coveragerc's omit list.
    - python ci/compile_all.py

# The mutation gate (ci/gates.sh `mutation`, ci/mutation_gate.py). Would the
# tests this change SHIPPED notice if the code it touched were wrong? A green
# suite and a test that asserts nothing are the same observation from the
# outside — and this repository was bitten by that twice in one session, when a
# mutation harness scored 11 of 11 mutations "caught" while every run was
# failing for want of pytest. So the gate refuses to score anything unless its
# OWN baseline is green, which is the habit the first run did not have.
#
# It lays HEAD down in a scratch git worktree and breaks the code there, never
# in the checkout the job is running in, and it needs a history to diff against.
mutation:
  stage: static
  tags:
    - desk
  variables:
    PY_VERSION: "3.12"
  script:
    - *desk_python
    - *qt_deps
    # The full manifest, not just pytest: the gate's first act is to run the
    # shipped tests on the committed tree and refuse to score when that baseline
    # is red, and with no numpy it dies at conftest.py:25. This job only ever
    # passed because the desk's warm per-version venv already held what the
    # suite jobs had installed (the GitHub mirror, on a fresh runner, could not
    # get away with it). A no-op when the environment is already satisfied.
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    - python ci/mutation_gate.py --base HEAD~1 --ci

# The docs link gate (ci/gates.sh `links`, ci/link_check.py). A heading link
# fails silently — rename a heading and markdown does not complain, the reader
# clicks and nothing happens — and 137 of the 138 anchor links in this repo are
# the two ledgers' generated indexes. Stdlib only, no network, ~1 s: nothing to
# install and nothing that can be missing, so this gate never SKIPs.
links:
  stage: static
  tags:
    - desk
  variables:
    PY_VERSION: "3.12"
  script:
    - *desk_python
    - python ci/link_check.py

# --- Shell checks + pin guards (GH: `shell` job) ----------------------------
shell:
  stage: static
  tags:
    - desk
  script:
    # GitHub side: action refs must stay immutable SHAs.
    - |
      if grep -nE 'uses: [^ ]+@v[0-9]+' .github/workflows/ci.yml; then
        echo "ERROR: GH action refs must be pinned to immutable SHAs."
        exit 1
      fi
    # GitLab side: image refs must stay digest-pinned (variable refs OK).
    - |
      bad=$(grep -nE '^[[:space:]]*image:' .gitlab-ci.yml | grep -v '@' || true)
      if [ -n "$bad" ]; then
        echo "ERROR: CI image refs must be digest-pinned (tag in a comment):"
        echo "$bad"
        exit 1
      fi
    # TRUST guard (2026-09-27, audit finding P1). Every job in this file runs
    # on the `desk` runner — a self-hosted runner on the developer's own
    # machine — so a pipeline whose source tree is not a protected ref would
    # execute untrusted code on that workstation. Two properties are load-
    # bearing, and this job fails CI if either is removed:
    #
    #   1. `merge_request_event` is refused by the workflow rules, so an MR's
    #      own tests/ci/install.sh never runs on the desk.
    #   2. the `.shared` after_script only runs the tree's ci/pytest_summary.py
    #      on a protected ref, and unsets GITLAB_SUMMARY_TOKEN otherwise.
    #
    # Checked by text, not by a YAML parse, for the same reason the rest of
    # this job is: PyYAML is not in requirements.txt and must not be.
    - |
      fail=0
      if ! grep -A6 '^  rules:' .gitlab-ci.yml \
           | grep -q 'CI_PIPELINE_SOURCE == "merge_request_event"'; then
        echo "ERROR: workflow.rules no longer mentions merge_request_event."
        echo "  Keep the rule present WITH 'when: never' — it is what keeps"
        echo "  merge-request code off the self-hosted desk runner."
        fail=1
      elif ! grep -A2 'CI_PIPELINE_SOURCE == "merge_request_event"' .gitlab-ci.yml \
           | grep -q 'when: never'; then
        echo "ERROR: merge_request_event is admitted without 'when: never'."
        echo "  That would run untrusted MR code on the desk runner."
        fail=1
      fi
      if ! grep -q 'CI_COMMIT_REF_PROTECTED' .gitlab-ci.yml; then
        echo "ERROR: .shared after_script no longer checks CI_COMMIT_REF_PROTECTED."
        echo "  GITLAB_SUMMARY_TOKEN is a personal access token read from the"
        echo "  environment by ci/pytest_summary.py; it must not reach a"
        echo "  pipeline whose ref is not protected."
        fail=1
      fi
      [ "$fail" = 0 ] || exit 1
    # Every shell script DISCOVERED, not listed, and discovered by SHEBANG:
    # `handsoff-restart` has no extension, so an extension glob misses exactly
    # the file the old hand-written list remembered — and the two workflows'
    # lists had already drifted apart (this one checked ci/apt_deps.sh, the
    # GitHub one did not), the same hand-maintained-list shape that let
    # core/theme.py escape the installer. `ci/gates.sh` runs this loop locally.
    - |
      rc=0
      list=$(mktemp)
      find . -type f \
        -not -path './.git/*' -not -path './attic/*' \
        -not -path './.freebuff/*' -not -path './.claude-flow/*' \
        -not -path './.swarm/*' -not -path './.agents/*' \
        -not -path './.codex/*' \
        -not -path './.venv/*' -not -path './venv/*' -not -path './env/*' \
        -not -path './node_modules/*' -not -path './build/*' -not -path './dist/*' \
        -not -path './.tox/*' -not -path './.mypy_cache/*' \
        -not -path './site-packages/*' | sort > "$list"
      while IFS= read -r f; do
        first=$(head -c 128 -- "$f" 2>/dev/null | tr -d '\000' | head -n 1) || continue
        case "$first" in
          '#!'*bash*|'#!'*'/sh'*) ;;
          *) continue ;;
        esac
        echo "--- bash -n $f"
        bash -n "$f" || rc=1
      done < "$list"
      rm -f "$list"
      [ "$rc" = 0 ] || exit 1

# --- Installer smoke (GH: `smoke` job) --------------------------------------
# --help must parse and print usage without touching the system.
smoke:
  stage: smoke
  tags:
    - desk
  script:
    - out=$(bash install.sh --help)
    - echo "$out" | grep -q "Options:"
    - echo "$out" | grep -q -- "--uninstall"

# --- Fresh-checkout freshness guard (ci/gates.sh `clean-checkout`) ----------
# The freshness guard reads the plan, the key census and the spec citations out
# of FILES. In this shared checkout it can see work that is not committed, so
# the one tree nobody ever looks at — the COMMITTED one — is the one this job
# looks at: a worktree of HEAD runs tests/test_specs_freshness.py alone. Found
# live: bd9cf5a was green here and had THREE red guards in a clean checkout.
clean-checkout:
  stage: static
  tags:
    - desk
  variables:
    PY_VERSION: "3.12"
  # The guard imports the app module (it builds the census from the real
  # collector), so it needs the same runtime libraries every suite job gets.
  <<: *shared
  script:
    - *desk_python
    - *qt_deps
    - pip install pytest
    - |
      dir=$(mktemp -d -t handsoff-clean-XXXXXX)
      tree="$dir/tree"
      git worktree add --detach --quiet "$tree" HEAD
      rc=0
      (cd "$tree" && QT_QPA_PLATFORM=offscreen python -m pytest \
        tests/test_specs_freshness.py -q) || rc=1
      git worktree remove --force "$tree" || true
      rm -rf "$dir"
      git worktree prune
      [ "$rc" = 0 ] || exit 1

# --- Concurrent-writer probe (ci/gates.sh `two-writer`) ---------------------
# Compares this tree's fingerprint against the baseline the suite legs laid
# down (`ci/worktree_stamp.py`), so a write that landed DURING a pipeline —
# after the tests graded one tree and before the artifacts were uploaded — is
# named instead of silently folded into a green verdict. The local gate runs
# it with --since for placement; a pipeline has no checkpoint chain, so the
# comparison is against the run's own start: GitLab supplies it as an env
# default the shell expands before python sees it.
two-writer:
  stage: smoke
  tags:
    - desk
  variables:
    PY_VERSION: "3.12"
  script:
    - *desk_python
    - python ci/worktree_stamp.py --root "$CI_PROJECT_DIR" \
        --compare "$CI_PROJECT_DIR/.two-writer-baseline.json"
  # The baseline is captured by a before_script in the SAME job rather than
  # trusted from the suite legs: the pipeline is the writer window, not any
  # one job.
  before_script:
    - *desk_python
    - python ci/worktree_stamp.py --root "$CI_PROJECT_DIR" \
        --save "$CI_PROJECT_DIR/.two-writer-baseline.json"
