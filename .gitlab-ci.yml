# GitLab CI — mirrors .github/workflows/ci.yml gate-for-gate for this repo's
# GitLab remote (origin: gitlab.com/GeneticxClm/handsoff). The GitHub
# workflow stays the authoritative definition: when a gate changes there,
# change it here too.
#
# Supply-chain parity with the GH pins: every image below is pinned by
# *digest* (tag kept in a trailing comment), and the `shell` job fails CI if
# a mutable tag-only image ref ever sneaks back in — same policy as the
# SHA-pinned GH actions.
#
# Debian slim + PySide6 + sounddevice: the PySide6 wheels bundle Qt but
# offscreen rendering still needs runtime libraries (glib/GL/EGL/xkbcommon/
# dbus/fontconfig), and sounddevice needs the PortAudio library itself
# (libportaudio2) plus the ALSA runtime that PortAudio links against
# (libasound2t64) — see the `.qt_deps` note below, where getting that pair
# wrong is what failed the tests jobs. The GitHub runners get all of these
# from the shared ubuntu image; Debian slim needs them explicitly. Digests are
# frozen, so the Debian base (trixie, hence the t64 package names) cannot
# drift under us.
#
# When a suite job fails, read the summary before the log: the junit report
# gives GitLab's Test-summary tab, and `after_script` prints a short digest of
# failing tests plus the known env-fix hints (see ci/pytest_summary.py).

stages: [test, static, smoke]

default:
  interruptible: true

# Per-job plumbing shared by every job that runs the suite: the pip download
# cache (keyed on the constraints file), the junit report that feeds GitLab's
# native Test-summary tab and MR test widget, and the log digest that turns a
# failure into a short list of names + messages + the env fix.
#
# `when: always` + `after_script` are what make failures self-explanatory: the
# report uploads and the digest prints even when the job dies, and both follow
# the report even when it was never written (the digest says so explicitly).
.shared: &shared
  cache:
    key:
      files:
        - requirements-lock.txt
    paths:
      - .pip-cache
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: tests/report.xml
  # A fresh shell with a reset cwd, so both paths are absolute.
  after_script:
    - python "$CI_PROJECT_DIR/ci/pytest_summary.py"
      "$CI_PROJECT_DIR/tests/report.xml" --post

# The apt layer every suite job inherits. It is a SCRIPT, not a one-liner:
# a single unknown package name fails the whole `apt-get install`, the `&&`
# chain then installs nothing, and the job runs the entire suite against a
# container with no audio or Qt runtime — hundreds of `import handsoff` errors
# whose cause is one line at the top of the log. That is not hypothetical:
# `libdbus-1-3t64` does not exist in this image, so nothing was ever installed,
# no matter what the list said. ci/apt_deps.sh installs each package on its
# own, tries the t64 and plain names, and then verifies the SONAMEs by file —
# including the `ctypes.util.find_library('portaudio')` lookup sounddevice
# performs at import — so a gap fails there, by name.
.qt_deps: &qt_deps
  "bash ci/apt_deps.sh"

# --- The full test suite (GH: `tests` matrix job) ---------------------------
# Single source of truth: requirements.txt (pinned floors) installed with the
# checked-in constraints file for reproducibility — same as GH.
.tests_base:
  stage: test
  variables:
    # The offscreen-launch test spawns the real bubble without a display.
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  <<: *shared
  script:
    - *qt_deps
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    - python -m pytest tests/ -q
      --junitxml="$CI_PROJECT_DIR/tests/report.xml"

tests:3.12:
  extends: .tests_base
  image: "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea" # 3.12-slim

tests:3.13:
  extends: .tests_base
  image: "python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285" # 3.13-slim

# --- Ordering-dependence probe (GH: `order` job) ---------------------------
# The suite must pass whatever order it runs in; the default collection order
# is what hides a dependence on it. Two full re-runs: tests shuffled, then
# only the FILE order shuffled. The seed is the commit SHA (different every
# commit, printed by the run banner, exactly reproducible). The first run to
# fail leaves its junit report in place for the summary — the pipeline stops
# before the second overwrites it.
order:
  stage: test
  image: "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea" # 3.12-slim
  variables:
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  <<: *shared
  # Restated rather than inherited: a job that declares `artifacts` REPLACES the
  # shared block's, so the `when`/`expire_in` have to be here too or the upload
  # would only happen on success. The junit list is the whole point — both
  # reports reach the Test tab, so neither run's verdict can hide the other's.
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - tests/report.xml
        - tests/report-order-files.xml
  # The shared digest reads the first report and posts the MR note; this adds
  # the second report to the log as a section of its own. Deleting the shared
  # one is not an option (every suite job needs it), so the override is here.
  after_script:
    - python "$CI_PROJECT_DIR/ci/pytest_summary.py"
      "$CI_PROJECT_DIR/tests/report.xml" --post
    - python "$CI_PROJECT_DIR/ci/pytest_summary.py"
      "$CI_PROJECT_DIR/tests/report-order-files.xml"
  script:
    - *qt_deps
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    # Two runs, two reports. Both used to write tests/report.xml, so the second
    # overwrote the first: a FILE-order failure replaced the seed-order run's
    # report in GitLab's Test tab, and the report the shared anchor uploads
    # described only whichever run happened to be last. Each run now has its own
    # file, and BOTH are accepted — the artifact below lists both (a junit array
    # is part of the schema: verified against GitLab's own ci.json) and the log
    # digest reads both, the second one WITHOUT --post so the merge-request note
    # stays a single summary rather than two.
    - HANDSOFF_TEST_ORDER_SEED="$CI_COMMIT_SHA" python -m pytest tests/ -q
      --junitxml="$CI_PROJECT_DIR/tests/report.xml"
    - HANDSOFF_TEST_ORDER_FILES="$CI_COMMIT_SHA" python -m pytest tests/ -q
      --junitxml="$CI_PROJECT_DIR/tests/report-order-files.xml"

# --- Coverage floor (GH: `coverage` job) ------------------------------------
coverage:
  stage: test
  image: "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea" # 3.12-slim
  variables:
    QT_QPA_PLATFORM: offscreen
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    # Subprocess coverage: the offscreen-GUI drivers engage measurement when
    # COVERAGE_PROCESS_START is set, and the absolute COVERAGE_FILE keeps
    # their parallel data files in the workspace for the combine.
    COVERAGE_PROCESS_START: "$CI_PROJECT_DIR/.coveragerc"
    COVERAGE_FILE: "$CI_PROJECT_DIR/.coverage"
  <<: *shared
  script:
    - *qt_deps
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -c requirements-lock.txt
    - pip install pytest-cov
    - python -m pytest tests/ -q --cov=. --cov-config=.coveragerc
      --cov-report=term-missing --cov-fail-under=70
      --junitxml="$CI_PROJECT_DIR/tests/report.xml"

# --- Byte-compile every shipped source (GH: `compile` job) ------------------
# py_compile never imports: no Qt libs or dependencies needed at all.
compile:
  stage: static
  image: "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea" # 3.12-slim
  script:
    # Discovered, not listed: an enumerated compile set silently skips a newly
    # added module — exactly how core/theme.py escaped the installer. attic/
    # (provenance archive) stays out, matching .coveragerc's omit list.
    - python ci/compile_all.py

# --- Shell checks + pin guards (GH: `shell` job) ----------------------------
shell:
  stage: static
  image: "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea" # 3.12-slim
  script:
    # GitHub side: action refs must stay immutable SHAs.
    - |
      if grep -nE 'uses: [^ ]+@v[0-9]+' .github/workflows/ci.yml; then
        echo "ERROR: GH action refs must be pinned to immutable SHAs."
        exit 1
      fi
    # GitLab side: image refs must stay digest-pinned (variable refs OK).
    - |
      bad=$(grep -nE '^[[:space:]]*image:' .gitlab-ci.yml | grep -v '@' || true)
      if [ -n "$bad" ]; then
        echo "ERROR: CI image refs must be digest-pinned (tag in a comment):"
        echo "$bad"
        exit 1
      fi
    # Every shell script DISCOVERED, not listed, and discovered by SHEBANG:
    # `handsoff-restart` has no extension, so an extension glob misses exactly
    # the file the old hand-written list remembered — and the two workflows'
    # lists had already drifted apart (this one checked ci/apt_deps.sh, the
    # GitHub one did not), the same hand-maintained-list shape that let
    # core/theme.py escape the installer. `ci/gates.sh` runs this loop locally.
    - |
      rc=0
      list=$(mktemp)
      find . -type f \
        -not -path './.git/*' -not -path './attic/*' \
        -not -path './.venv/*' -not -path './venv/*' -not -path './env/*' \
        -not -path './node_modules/*' -not -path './build/*' -not -path './dist/*' | sort > "$list"
      while IFS= read -r f; do
        first=$(head -c 128 -- "$f" 2>/dev/null | tr -d '\000' | head -n 1) || continue
        case "$first" in
          '#!'*bash*|'#!'*'/sh'*) ;;
          *) continue ;;
        esac
        echo "--- bash -n $f"
        bash -n "$f" || rc=1
      done < "$list"
      rm -f "$list"
      [ "$rc" = 0 ] || exit 1

# --- Installer smoke (GH: `smoke` job) --------------------------------------
# --help must parse and print usage without touching the system.
smoke:
  stage: smoke
  image: "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea" # 3.12-slim
  script:
    - out=$(bash install.sh --help)
    - echo "$out" | grep -q "Options:"
    - echo "$out" | grep -q -- "--uninstall"
