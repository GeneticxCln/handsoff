name: CI

# Least privilege: every job here reads the checkout and nothing more. Without
# this block the default token is broad (contents/issues/PRs WRITE), which is
# more authority than any of these jobs uses.
permissions:
  contents: read

on:
  push:
  pull_request:

# One run per ref: a superseded push cancels the older run instead of racing it
# for runners and for the artifacts both write.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full test suite. Single source of truth: requirements.txt (pinned
  # floors: numpy<3, PySide6<7). Whisper/openwakeword are lazy-imported and
  # every test that touches them monkeypatches the call, so installing the full
  # manifest only costs time, never new failures. The speech engine is NOT in
  # the manifest (install.sh owns it): it pulls torch, which would cost every
  # job gigabytes on a GPU-less runner and buy nothing — the suite pins that
  # torch and chatterbox are never imported.
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A ceiling, not a budget: the suite is ~5 min, and a hung test otherwise
    # holds a runner until GitHub's own 6-hour limit.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is not decoration: install.sh takes whatever `python3` is on PATH
        # with no version check, so on a current Arch box the shipped
        # interpreter IS 3.14 while the gates below only spoke for 3.12/3.13 —
        # a green about a python nobody runs. Mirrored in .gitlab-ci.yml as
        # tests:3.14, and bounded below by the 3.12 floor in specs/90-audit.md.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # The offscreen-launch test spawns the real bubble without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      # Action refs are pinned to reviewed immutable SHAs (tag in comment).
      # The shell job below fails CI if a mutable tag ref ever sneaks back in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt
      - name: Run the test suite
        run: python -m pytest tests/ -q

  # Coverage floor: TOTAL must stay >= 70% (matches .coveragerc, which also
  # carries the omit list: tests/ and attic/ excluded).
  # Local `pytest` stays plugin-free; only this job installs pytest-cov.
  coverage:
    name: Coverage floor (>= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies + pytest-cov
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt
          pip install pytest-cov
      - name: pytest with coverage gate
        # COVERAGE_PROCESS_START makes the offscreen-GUI test drivers engage
        # subprocess coverage (pytest-cov 7 has no automatic .pth hook), and
        # the absolute COVERAGE_FILE keeps their parallel data files inside
        # the workspace so pytest-cov's combine picks them up.
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: python -m pytest tests/ -q --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=70

  # Ordering-dependence probe. The suite must pass whatever order it runs in,
  # but the default collection order is the one a developer sees every day, so
  # a dependence on it hides there and surfaces only when something unrelated
  # changes the file list. This job re-runs the whole suite twice: once with the
  # tests shuffled, once with only the FILE order shuffled (each file's own
  # sequence intact — a stricter probe of what a file leaves behind, and much
  # easier to read when it fires). The seed comes from the commit SHA, so the
  # order differs commit to commit yet is printed by the run banner and fully
  # reproducible. Only the 3.12 leg needs it; the shuffle is interpreter-blind.
  order:
    name: Ordering-dependence probe
    runs-on: ubuntu-latest
    # Two full suite runs — the only job that needs more than the suite's own
    # time.
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt
      - name: Shuffled test order
        env:
          HANDSOFF_TEST_ORDER_SEED: ${{ github.sha }}
        run: python -m pytest tests/ -q
      - name: Shuffled file order
        env:
          HANDSOFF_TEST_ORDER_FILES: ${{ github.sha }}
        run: python -m pytest tests/ -q

  # Byte-compile every shipped Python source. py_compile never imports, so no
  # dependencies are needed and syntax rot in any file fails the build.
  compile:
    name: Byte-compile sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: python -m py_compile (every source)
        run: |
          # Discovered, not listed: an enumerated compile set silently skips a
          # newly added module — which is exactly how core/theme.py escaped the
          # installer. attic/ is a provenance archive and stays out, matching
          # its exclusion from .coveragerc.
          python ci/compile_all.py

  # Shell syntax checks for every shipped script.
  # The lint gate (ci/gates.sh `lint`, ruff.toml). It was added because a
  # 41,000-line tree with no linter is a tree where an unused import, a
  # shadowed name and a zip() that silently drops a row all look like style —
  # and all three were present. ruff is pinned here AND in the gate's SKIP
  # message, so the local answer and this job's answer are the same rules.
  lint:
    name: Lint (ruff, pinned rule set)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned linter
        run: pip install 'ruff==0.16.4'
      - name: ruff check (the production sources, per ruff.toml)
        run: |
          ruff check --no-cache \
            handsoff.py handsoff-settings.py hardware.py settings_schema.py \
            core/ ci/

  # Would the tests this change SHIPPED notice if the code it touched were
  # wrong (ci/gates.sh `mutation`, ci/mutation_gate.py)?
  #
  # A green suite and a test that asserts nothing are the same observation from
  # the outside, and this repository was bitten by that twice in one session — a
  # mutation harness that scored 11 of 11 mutations "caught" while every run was
  # failing for want of pytest. The gate lays HEAD down in a scratch worktree,
  # breaks the functions the diff touched one mutant at a time, and refuses to
  # score anything if its own baseline is red. It needs pytest, so unlike
  # `links` it is not stdlib-only; a pipeline checkout is already clean, which
  # is the other thing the gate insists on locally.
  mutation:
    name: Mutation (are a new test's guards load-bearing?)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A history to diff against. The gate measures HEAD against a base
          # commit, and on a push that base is HEAD~1.
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the test runner
        run: pip install pytest
      - name: Every mutant of the touched lines is caught
        run: python ci/mutation_gate.py --base HEAD~1

  # Every markdown anchor link resolves to a real heading (ci/gates.sh
  # `links`, ci/link_check.py). A heading link is the one link that fails
  # SILENTLY: rename a heading and nothing complains, the reader clicks and
  # nothing happens — and 137 of the 138 anchor links here are the two
  # ledgers' generated indexes, so a rename strands a quarter of the
  # navigation. Stdlib only: no install step, no network, nothing to be missing.
  links:
    name: Docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Every anchor link resolves
        run: python ci/link_check.py

  shell:
    name: Shell syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify actions are SHA-pinned
        run: |
          if grep -nE 'uses: [^ ]+@v[0-9]+' .github/workflows/ci.yml; then
            echo '::error::Action refs must be pinned to immutable SHAs (keep the version in a trailing comment).'
            exit 1
          fi
          echo 'all action refs are immutable SHAs'
      - name: bash -n (every shell script, discovered)
        run: |
          # Discovered by SHEBANG, not by a list or an extension glob: the two
          # workflows' enumerated lists had already drifted apart (GitLab's
          # checked ci/apt_deps.sh, this one did not), and `handsoff-restart`
          # has no extension, so `*.sh` misses exactly it.
          rc=0
          list=$(mktemp)
          find . -type f \
            -not -path './.git/*' -not -path './attic/*' \
            -not -path './.freebuff/*' -not -path './.claude-flow/*' \
            -not -path './.swarm/*' -not -path './.agents/*' \
            -not -path './.codex/*' \
            -not -path './.venv/*' -not -path './venv/*' -not -path './env/*' \
            -not -path './node_modules/*' -not -path './build/*' -not -path './dist/*' \
            -not -path './.tox/*' -not -path './.mypy_cache/*' \
            -not -path './site-packages/*' | sort > "$list"
          while IFS= read -r f; do
            first=$(head -c 128 -- "$f" 2>/dev/null | tr -d '\000' | head -n 1) || continue
            case "$first" in
              '#!'*bash*|'#!'*'/sh'*) ;;
              *) continue ;;
            esac
            echo "--- bash -n $f"
            bash -n "$f" || rc=1
          done < "$list"
          rm -f "$list"
          [ "$rc" = 0 ] || exit 1

  # Installer smoke test: --help must parse and print usage without touching
  # the system. Catches installer drift (syntax rot, broken early flow) even
  # though the full install needs Arch + a real desktop.
  smoke:
    name: Installer smoke (--help)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash install.sh --help
        run: |
          out=$(bash install.sh --help)
          echo "$out" | grep -q "Options:"
          echo "$out" | grep -q -- "--uninstall"
