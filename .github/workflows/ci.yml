name: CI

on:
  push:
  pull_request:

jobs:
  # The full test suite. Single source of truth: requirements.txt (pinned
  # floors: numpy<3, PySide6<7). Whisper/openwakeword are lazy-imported and
  # every test that touches them monkeypatches the call, so installing the full
  # manifest only costs time, never new failures. The speech engine is NOT in
  # the manifest (install.sh owns it): it pulls torch, which would cost every
  # job gigabytes on a GPU-less runner and buy nothing — the suite pins that
  # torch and chatterbox are never imported.
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # The offscreen-launch test spawns the real bubble without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      # Action refs are pinned to reviewed immutable SHAs (tag in comment).
      # The shell job below fails CI if a mutable tag ref ever sneaks back in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt
      - name: Run the test suite
        run: python -m pytest tests/ -q

  # Coverage floor: TOTAL must stay >= 70% (matches .coveragerc, which also
  # carries the omit list: tests/ and attic/ excluded).
  # Local `pytest` stays plugin-free; only this job installs pytest-cov.
  coverage:
    name: Coverage floor (>= 70%)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies + pytest-cov
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt
          pip install pytest-cov
      - name: pytest with coverage gate
        # COVERAGE_PROCESS_START makes the offscreen-GUI test drivers engage
        # subprocess coverage (pytest-cov 7 has no automatic .pth hook), and
        # the absolute COVERAGE_FILE keeps their parallel data files inside
        # the workspace so pytest-cov's combine picks them up.
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: python -m pytest tests/ -q --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=70

  # Ordering-dependence probe. The suite must pass whatever order it runs in,
  # but the default collection order is the one a developer sees every day, so
  # a dependence on it hides there and surfaces only when something unrelated
  # changes the file list. This job re-runs the whole suite twice: once with the
  # tests shuffled, once with only the FILE order shuffled (each file's own
  # sequence intact — a stricter probe of what a file leaves behind, and much
  # easier to read when it fires). The seed comes from the commit SHA, so the
  # order differs commit to commit yet is printed by the run banner and fully
  # reproducible. Only the 3.12 leg needs it; the shuffle is interpreter-blind.
  order:
    name: Ordering-dependence probe
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt
      - name: Shuffled test order
        env:
          HANDSOFF_TEST_ORDER_SEED: ${{ github.sha }}
        run: python -m pytest tests/ -q
      - name: Shuffled file order
        env:
          HANDSOFF_TEST_ORDER_FILES: ${{ github.sha }}
        run: python -m pytest tests/ -q

  # Byte-compile every shipped Python source. py_compile never imports, so no
  # dependencies are needed and syntax rot in any file fails the build.
  compile:
    name: Byte-compile sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: python -m py_compile (every source)
        run: |
          # Discovered, not listed: an enumerated compile set silently skips a
          # newly added module — which is exactly how core/theme.py escaped the
          # installer. attic/ is a provenance archive and stays out, matching
          # its exclusion from .coveragerc.
          python ci/compile_all.py

  # Shell syntax checks for every shipped script.
  shell:
    name: Shell syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify actions are SHA-pinned
        run: |
          if grep -nE 'uses: [^ ]+@v[0-9]+' .github/workflows/ci.yml; then
            echo '::error::Action refs must be pinned to immutable SHAs (keep the version in a trailing comment).'
            exit 1
          fi
          echo 'all action refs are immutable SHAs'
      - name: bash -n (every shell script, discovered)
        run: |
          # Discovered by SHEBANG, not by a list or an extension glob: the two
          # workflows' enumerated lists had already drifted apart (GitLab's
          # checked ci/apt_deps.sh, this one did not), and `handsoff-restart`
          # has no extension, so `*.sh` misses exactly it.
          rc=0
          list=$(mktemp)
          find . -type f \
            -not -path './.git/*' -not -path './attic/*' \
            -not -path './.venv/*' -not -path './venv/*' -not -path './env/*' \
            -not -path './node_modules/*' -not -path './build/*' -not -path './dist/*' | sort > "$list"
          while IFS= read -r f; do
            first=$(head -c 128 -- "$f" 2>/dev/null | tr -d '\000' | head -n 1) || continue
            case "$first" in
              '#!'*bash*|'#!'*'/sh'*) ;;
              *) continue ;;
            esac
            echo "--- bash -n $f"
            bash -n "$f" || rc=1
          done < "$list"
          rm -f "$list"
          [ "$rc" = 0 ] || exit 1

  # Installer smoke test: --help must parse and print usage without touching
  # the system. Catches installer drift (syntax rot, broken early flow) even
  # though the full install needs Arch + a real desktop.
  smoke:
    name: Installer smoke (--help)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash install.sh --help
        run: |
          out=$(bash install.sh --help)
          echo "$out" | grep -q "Options:"
          echo "$out" | grep -q -- "--uninstall"
