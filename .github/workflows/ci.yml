name: CI

on:
  push:
  pull_request:

jobs:
  # The full test suite. Dependencies are deliberately minimal: numpy, pytest,
  # PySide6 and sounddevice are the suite's hard imports — whisper/piper/
  # openwakeword are lazy-imported and every test that touches them
  # monkeypatches the call, so they are not installed here (verified: the
  # suite passes 350/350 in a clean venv with only these four).
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # The offscreen-launch test spawns the real bubble without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 sounddevice
      - name: Run the test suite
        run: python -m pytest test_handsoff.py -q

  # Byte-compile every shipped Python source. py_compile never imports, so no
  # dependencies are needed and syntax rot in any file fails the build.
  compile:
    name: Byte-compile sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python -m py_compile
        run: python -m py_compile handsoff.py handsoff-settings.py test_handsoff.py attic/patch_wakeword.py tests/fake_ollama.py

  # Shell syntax checks for every shipped script.
  shell:
    name: Shell syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          bash -n install.sh
          bash -n handsoff-restart

  # Installer smoke test: --help must parse and print usage without touching
  # the system. Catches installer drift (syntax rot, broken early flow) even
  # though the full install needs Arch + a real desktop.
  smoke:
    name: Installer smoke (--help)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash install.sh --help
        run: |
          out=$(bash install.sh --help)
          echo "$out" | grep -q "Options:"
          echo "$out" | grep -q -- "--uninstall"