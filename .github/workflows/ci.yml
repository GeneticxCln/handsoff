name: CI

on:
  push:
  pull_request:

jobs:
  # The full test suite. Single source of truth: requirements.txt (pinned
  # floors: numpy<3, PySide6<7). Whisper/piper/openwakeword are lazy-imported
  # and every test that touches them monkeypatches the call, so installing
  # the full manifest only costs time, never new failures.
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # The offscreen-launch test spawns the real bubble without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the test suite
        run: python -m pytest tests/ -q

  # Coverage floor: TOTAL must stay >= 60% (the suite measures ~75%).
  # Local `pytest` stays plugin-free; only this job installs pytest-cov.
  # Omit list + floor live in .coveragerc (tests/ and attic/ excluded).
  coverage:
    name: Coverage floor (>= 60%)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies + pytest-cov
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: pytest with coverage gate
        run: python -m pytest tests/ -q --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=60

  # Byte-compile every shipped Python source. py_compile never imports, so no
  # dependencies are needed and syntax rot in any file fails the build.
  compile:
    name: Byte-compile sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python -m py_compile
        run: |
          python -m py_compile handsoff.py handsoff-settings.py attic/patch_wakeword.py tests/fake_ollama.py
          python -m py_compile tests/*.py

  # Shell syntax checks for every shipped script.
  shell:
    name: Shell syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          bash -n install.sh
          bash -n handsoff-restart

  # Installer smoke test: --help must parse and print usage without touching
  # the system. Catches installer drift (syntax rot, broken early flow) even
  # though the full install needs Arch + a real desktop.
  smoke:
    name: Installer smoke (--help)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash install.sh --help
        run: |
          out=$(bash install.sh --help)
          echo "$out" | grep -q "Options:"
          echo "$out" | grep -q -- "--uninstall"